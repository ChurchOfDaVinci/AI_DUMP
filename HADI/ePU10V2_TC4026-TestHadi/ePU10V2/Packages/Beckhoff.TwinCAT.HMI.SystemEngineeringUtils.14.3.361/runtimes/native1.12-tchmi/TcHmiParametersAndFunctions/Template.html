<div class="TcHmi_Controls_Beckhoff_TcHmiParametersAndFunctions-template tchmi-box">
    <div class="top-bar">
        <div class="toggle-navigation">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="feather feather-menu"
            >
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
        <div
            id="{Id}_TcHmiBreadcrumb"
            class="breadcrumb"
            data-tchmi-type="TcHmi.Controls.BaseTemplate.TcHmiBreadcrumb"
            data-tchmi-height="30"
            data-tchmi-height-unit="px"
            data-tchmi-left="0"
            data-tchmi-left-unit="px"
            data-tchmi-top="0"
            data-tchmi-top-unit="px"
            data-tchmi-width="100"
            data-tchmi-width-unit="%"
        ></div>
    </div>

    <tchmi-split-view data-alignment="horizontal" id="{Id}_wrapper" class="outer-wrapper">
        <div id="{Id}_nav" data-resizable="horizontal" class="navigation">
            <div class="navigation-buttons">
                <div class="btn-all-symbols nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-home"
                    >
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span data-tchmi-localized-content-key="AllParameters"></span>
                </div>
                <div class="btn-changes nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-edit-3"
                    >
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    <span class="btn-changes-text" data-tchmi-localized-content-key="NoChanges"></span>
                    <span class="number-of-changes notification-bubble hide"></span>
                </div>
                <div class="btn-import-symbols nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-upload"
                    >
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span data-tchmi-localized-content-key="ImportParameters"></span>
                </div>
                <div class="btn-export-symbols nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-download"
                    >
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span data-tchmi-localized-content-key="ExportParameters"></span>
                </div>
                <div class="btn-teach-symbol-values nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-save"
                    >
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span data-tchmi-localized-content-key="TeachSymbolValues"></span>
                </div>
                <div class="config-runtime nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-info"
                    >
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>
                        <span data-tchmi-localized-content-key="ConfigRuntime"></span>:
                        <span class="config-runtime-name"></span>
                        <span class="runtime-diagnostics-toggle-btn">
                            <div class="arrow arrow-down"></div>
                        </span>
                        <div class="runtime-diagnostics collapse-runtime-diagnostics">
                            <div class="full-row gap-row"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="SymbolInitState"></div>
                            <div class="diagnostics-value diagnostics-symbol-init-state"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="SymbolUpdateError"></div>
                            <div class="diagnostics-value diagnostics-symbol-update-error"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="SymbolUpdateStateDesc"></div>
                            <div class="diagnostics-value diagnostics-symbol-update-state-desc"></div>

                            <div
                                class="full-row ads-runtime-header"
                                data-tchmi-localized-content-key="ADSRuntime"
                            ></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="ADSState"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-ads-state"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="ADSVersion"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-ads-version"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="ADSProjectName"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-ads-project-name"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="ADSProjectCompiledAt"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-ads-project-compiled-at"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="ConnectionState"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-connection-state"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="SystemServiceADSState"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-system-service-ads-state"></div>
                            <div class="diagnostics-key" data-tchmi-localized-content-key="DeviceName"></div>
                            <div class="diagnostics-value diagnostics-ads-runtime-device-name"></div>
                        </div>
                    </span>
                </div>
                <div class="btn-update-symbols nav-button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="feather feather-refresh-cw"
                    >
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span data-tchmi-localized-content-key="UpdatePLCSymbols"></span>
                    <span
                        data-tchmi-localized-content-key="Required"
                        class="runtime-up-to-date notification-bubble hide"
                    ></span>
                    <span class="btn-status"></span>
                </div>
            </div>
            <div class="tree-view-container">
                <div class="tree-view-placeholder">
                    <div class="item"></div>
                    <div class="item"></div>
                    <div class="item" style="margin-left: 20px"></div>
                    <div class="item"></div>
                    <div class="item" style="margin-left: 40px"></div>
                    <div class="item"></div>
                    <div class="item" style="margin-left: 40px"></div>
                    <div class="item"></div>
                    <div class="item" style="margin-left: 20px"></div>
                    <div class="item"></div>
                </div>
                <div
                    id="{Id}_TcHmiTreeView"
                    data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiTreeView"
                    data-tchmi-height="100"
                    data-tchmi-height-unit="%"
                    data-tchmi-left="0"
                    data-tchmi-left-unit="px"
                    data-tchmi-top="0"
                    data-tchmi-top-unit="px"
                    data-tchmi-width="100"
                    data-tchmi-width-unit="%"
                    data-tchmi-hierarchical-data-property="children"
                    style="position: relative"
                ></div>
            </div>
        </div>
        <div class="page-content">
            <div class="notification-wrapper hide"></div>
        </div>
    </tchmi-split-view>
    <div class="local-top-most-layer"></div>
</div>
